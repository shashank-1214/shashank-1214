<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract AI artwork backdrop">
  <title>Hero backdrop</title>
  <desc>Abstract gradient mesh, neural rings and particle field used as the hero section background.</desc>

  <defs>
    <radialGradient id="meshA" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshB" cx="85%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshC" cx="55%" cy="95%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hRingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="hThreadGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="hRounded">
      <rect x="0" y="0" width="1200" height="320" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hRounded)">
    <rect x="0" y="0" width="1200" height="320" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1200" height="320" fill="url(#meshA)"/>
    <rect x="0" y="0" width="1200" height="320" fill="url(#meshB)"/>
    <rect x="0" y="0" width="1200" height="320" fill="url(#meshC)"/>

    <!-- faint neural thread lines, far edges only, kept clear of center content -->
    <path d="M -20 60 C 150 20, 260 120, 60 180" fill="none" stroke="url(#hThreadGrad)" stroke-width="1"/>
    <path d="M 1220 70 C 1040 30, 950 130, 1140 190" fill="none" stroke="url(#hThreadGrad)" stroke-width="1"/>
    <path d="M -10 280 C 120 250, 200 300, 80 320" fill="none" stroke="url(#hThreadGrad)" stroke-width="1"/>
    <path d="M 1210 250 C 1080 230, 1000 290, 1130 320" fill="none" stroke="url(#hThreadGrad)" stroke-width="1"/>

    <!-- large soft neural ring, upper right, mostly off-canvas -->
    <g transform="translate(1060,40)" opacity="0.5">
      <circle r="160" fill="none" stroke="url(#hRingGrad)" stroke-width="0.6" opacity="0.35"/>
      <circle r="110" fill="none" stroke="url(#hRingGrad)" stroke-width="0.6" opacity="0.45"/>
      <circle r="64" fill="none" stroke="url(#hRingGrad)" stroke-width="0.7" opacity="0.55"/>
    </g>

    <!-- small soft ring, lower left, mostly off-canvas -->
    <g transform="translate(70,300)" opacity="0.45">
      <circle r="90" fill="none" stroke="url(#hRingGrad)" stroke-width="0.6" opacity="0.35"/>
      <circle r="50" fill="none" stroke="url(#hRingGrad)" stroke-width="0.6" opacity="0.45"/>
    </g>

    <!-- scattered particle field, kept clear of x:90-820 y:50-270 content zone -->
    <g>
      <circle cx="828" cy="44" r="1.6" fill="#8B5CF6" opacity="0.30"/>
      <circle cx="138" cy="279" r="1.4" fill="#2563EB" opacity="0.30"/>
      <circle cx="878" cy="93" r="1.8" fill="#8B5CF6" opacity="0.28"/>
      <circle cx="441" cy="274" r="1.8" fill="#6366F1" opacity="0.38"/>
      <circle cx="973" cy="252" r="1.5" fill="#2563EB" opacity="0.35"/>
      <circle cx="634" cy="288" r="1.6" fill="#6366F1" opacity="0.34"/>
      <circle cx="261" cy="282" r="1.4" fill="#6366F1" opacity="0.24"/>
      <circle cx="1021" cy="235" r="1.3" fill="#8B5CF6" opacity="0.24"/>
      <circle cx="1162" cy="180" r="1.5" fill="#6366F1" opacity="0.33"/>
      <circle cx="954" cy="55" r="1.8" fill="#6366F1" opacity="0.29"/>
      <circle cx="730" cy="31" r="1.6" fill="#6366F1" opacity="0.22"/>
      <circle cx="820" cy="274" r="1.3" fill="#6366F1" opacity="0.27"/>
      <circle cx="901" cy="162" r="1.6" fill="#6366F1" opacity="0.30"/>
      <circle cx="44" cy="268" r="1.7" fill="#2563EB" opacity="0.26"/>
      <circle cx="28" cy="94" r="1.5" fill="#6366F1" opacity="0.30"/>
      <circle cx="1075" cy="47" r="1.5" fill="#8B5CF6" opacity="0.34"/>
      <circle cx="823" cy="223" r="1.4" fill="#2563EB" opacity="0.28"/>
      <circle cx="20" cy="97" r="1.5" fill="#6366F1" opacity="0.30"/>
      <circle cx="1019" cy="258" r="1.5" fill="#6366F1" opacity="0.22"/>
      <circle cx="1132" cy="33" r="1.7" fill="#6366F1" opacity="0.36"/>
      <circle cx="1081" cy="207" r="1.8" fill="#6366F1" opacity="0.32"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#E5E9F2" stroke-width="1.5"/>
</svg>
