<svg width="1200" height="32" viewBox="0 0 1200 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section divider">
  <title>Divider</title>
  <desc>Thin gradient rule used to separate README sections.</desc>

  <defs>
    <linearGradient id="dLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="15%" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dDotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="15" width="1200" height="1.5" fill="url(#dLineGrad)"/>
  <circle cx="600" cy="16" r="3" fill="url(#dDotGrad)"/>
</svg>
