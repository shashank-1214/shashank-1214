<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Profile footer — thanks for visiting">
  <title>Footer — M. Davamshu Shashank</title>
  <desc>Light closing banner with a small AI-core motif and a thank-you line.</desc>

  <defs>
    <linearGradient id="fBgGrad" x1="0" y1="0" x2="1200" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F9FC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="fBrandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="fLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="fCoreCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="fRoundedCanvas">
      <rect x="0" y="0" width="1200" height="140" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#fRoundedCanvas)">
    <rect x="0" y="0" width="1200" height="140" fill="url(#fBgGrad)"/>

    <rect x="60" y="0" width="1080" height="1" fill="url(#fLineGrad)"/>

    <!-- small AI core motif, centered -->
    <g transform="translate(600,44) scale(0.74)">
      <circle r="34" fill="none" stroke="url(#fBrandGrad)" stroke-width="1" opacity="0.55"/>
      <circle r="20" fill="none" stroke="url(#fBrandGrad)" stroke-width="1.2" opacity="0.75"/>
      <circle cx="0" cy="-34" r="2.4" fill="#2563EB"/>
      <circle cx="34" cy="0" r="2" fill="#8B5CF6"/>
      <circle cx="0" cy="34" r="2" fill="#6366F1"/>
      <circle cx="-34" cy="0" r="2.4" fill="#2563EB"/>
      <circle r="10" fill="url(#fCoreCenter)"/>
      <circle r="10" fill="none" stroke="url(#fBrandGrad)" stroke-width="1.2"/>
      <circle r="3.2" fill="url(#fBrandGrad)"/>
    </g>

    <text x="600" y="100" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#0F172A">Thanks for stopping by</text>

    <text x="600" y="120" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#64748B">M. Davamshu Shashank · AI &amp; ML Engineer · Frontend Developer</text>
  </g>

  <rect x="1" y="1" width="1198" height="138" rx="19" fill="none" stroke="#E5E9F2" stroke-width="1.5"/>
</svg>
